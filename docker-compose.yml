services:
  # Workstation nodes
  node-1:
    build: .
    container_name: ws-psi-node-1
    ports:
      - "5002:5000"
    networks:
      - container_network
    environment:
      - PORT=5000
      - DEVICE_TYPE=WS
      - CPU_CORES=1
      - MEMORY_MB=2048
      - LD_LIBRARY_PATH=/opt/oqs/lib
      - OQS_INSTALL_PATH=/opt/oqs
      - BENCHMARK_MODE=false
    volumes:
      - ./FirebaseCredentials.json:/app/FirebaseCredentials.json
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g

  node-2:
