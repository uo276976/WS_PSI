services:
  # --- Workstation nodes ---
  node-1:
    build: .
    container_name: ws-psi-node-1
    ports:
      - "5002:5000"
    networks:
      - container_network
    environment:
      - PORT=5000
      - DEVICE_TYPE=WS
      - LD_LIBRARY_PATH=/opt/oqs/lib
      - OQS_INSTALL_PATH=/opt/oqs
      - BENCHMARK_MODE=true
    volumes:
      - ./FirebaseCredentials.json:/app/FirebaseCredentials.json
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 4g

  node-2:
    build: .
    container_name: ws-psi-node-2
