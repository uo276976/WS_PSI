x-build: &default-build
  context: .
  dockerfile: Dockerfile

services:
  # Workstation nodes
  node-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: ws-psi:latest
    container_name: ws-psi-node-1
    ports:
      - "5002:5000"
    networks:
      - container_network
    environment:
      - PORT=5000
      - EXTERNAL_PORT=5002
      - DEVICE_TYPE=WS
      - CPU_CORES=1
      - MEMORY_MB=2048
      - BENCHMARK_MODE=true
    volumes:
      - ./FirebaseCredentials.json:/app/FirebaseCredentials.json
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g

  node-2:
    image: ws-psi:latest
    container_name: ws-psi-node-2
    ports:
      - "5003:5000"
    networks:
      - container_network
    environment:
      - PORT=5000
      - EXTERNAL_PORT=5003
      - DEVICE_TYPE=WS
      - CPU_CORES=1
      - MEMORY_MB=2048
      - BENCHMARK_MODE=true
    volumes:
      - ./FirebaseCredentials.json:/app/FirebaseCredentials.json
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g

  # IoT nodes
  node-3:
    image: ws-psi:latest
    container_name: ws-psi-node-3
    ports:
      - "5004:5000"
    networks:
      - container_network
    environment:
      - PORT=5000
      - EXTERNAL_PORT=5004
      - DEVICE_TYPE=IoT
      - CPU_CORES=0.125
      - MEMORY_MB=256
      - BENCHMARK_MODE=true
    volumes:
      - ./FirebaseCredentials.json:/app/FirebaseCredentials.json
    restart: unless-stopped
    cpus: 0.125
    mem_limit: 256m

  node-4:
    image: ws-psi:latest
    container_name: ws-psi-node-4
    ports:
      - "5005:5000"
    networks:
      - container_network
    environment:
      - PORT=5000
      - EXTERNAL_PORT=5005
      - DEVICE_TYPE=IoT
      - CPU_CORES=0.125
      - MEMORY_MB=256
      - BENCHMARK_MODE=true
    volumes:
      - ./FirebaseCredentials.json:/app/FirebaseCredentials.json
    restart: unless-stopped
    cpus: 0.125
    mem_limit: 256m

  # Android nodes
  node-5:
    image: ws-psi:latest
    container_name: ws-psi-node-5
    ports:
      - "5006:5000"
    networks:
      - container_network
    environment:
      - PORT=5000
      - EXTERNAL_PORT=5006
      - DEVICE_TYPE=Android
      - CPU_CORES=0.5
      - MEMORY_MB=1024
      - BENCHMARK_MODE=true
    volumes:
      - ./FirebaseCredentials.json:/app/FirebaseCredentials.json
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 1g

  node-6:
    image: ws-psi:latest
    container_name: ws-psi-node-6
    ports:
      - "5007:5000"
    networks:
      - container_network
    environment:
      - PORT=5000
      - EXTERNAL_PORT=5007
      - DEVICE_TYPE=Android
      - CPU_CORES=0.5
      - MEMORY_MB=1024
      - BENCHMARK_MODE=true
    volumes:
      - ./FirebaseCredentials.json:/app/FirebaseCredentials.json
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 1g

networks:
  container_network: {}
