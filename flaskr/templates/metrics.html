<!DOCTYPE html>
<html lang="es">
<head>
    <title>Métricas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- Materialize -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- DataTables core -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- DataTables Buttons -->
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css" />
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

    <!-- JSZip & pdfmake for export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.36/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.36/vfs_fonts.js"></script>

    <link rel="stylesheet" href="../static/style.css">
    <script src="../static/metrics.js"></script>

    <style>
        #loading-spinner {
            display: none;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h4 id="mylogs">Logs recuperados</h4>
        <div class="row">
            <div class="col s12 m6 l4">
                <button class="btn waves-effect waves-light" onclick="location.href='/metrics'">Actualizar</button>
                <button class="btn waves-effect waves-light" onclick="location.href='/'">Volver</button>
                <button class="btn waves-effect waves-light" id="download-excel">Descargar Excel</button>
            </div>
        </div>

        <div class="row">
            <div class="col s12 m6">
                <label for="categoryFilter">Filtrar por categoría:</label>
                <select id="categoryFilter" class="browser-default">
                    <option value="All">Todas</option>
                </select>
            </div>
        </div>

        <div class="col s12 m6">
            <label for="deviceTypeFilter">Filtrar por tipo de dispositivo:</label>
            <select id="deviceTypeFilter" class="browser-default">
                <option value="All">Todos</option>
                <option value="WS">Workstation</option>
                <option value="IoT">IoT</option>
                <option value="Android">Android</option>
            </select>
        </div>

        <div class="row">
            <canvas id="metricsChart"></canvas>
        </div>

        <div class="row" id="stats-cards"></div>

        <div id="loading-spinner" class="preloader-wrapper big active">
            <div class="spinner-layer spinner-blue-only">
                <div class="circle-clipper left"><div class="circle"></div></div>
                <div class="gap-patch"><div class="circle"></div></div>
                <div class="circle-clipper right"><div class="circle"></div></div>
            </div>
        </div>

        <table class="striped" id="log-table">
            <thead>
                <tr>
                    <th>Fecha y hora</th>
                    <th>Actividad</th>
                    <th>Tiempo (s)</th>
                    <th>Uso de RAM</th>
                    <th>Uso de RAM - Programa</th>
                    <th>Uso de CPU</th>
                    <th>Uso de CPU - Programa</th>
                </tr>
            </thead>
            <tbody id="logs-body"></tbody>
        </table>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
